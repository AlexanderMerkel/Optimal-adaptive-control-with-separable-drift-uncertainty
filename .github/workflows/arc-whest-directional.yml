name: ARC Whest public directional K3 screen

on:
  push:
    branches: [arc-whest-autoresearch-20260829]
    paths:
      - "arc_whest/**"
      - ".github/workflows/arc-whest-directional.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_XET_HIGH_PERFORMANCE: "1"
  HF_HOME: ${{ github.workspace }}/.hf-cache
  OMP_NUM_THREADS: "4"
  OPENBLAS_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  NUMEXPR_NUM_THREADS: "4"

jobs:
  directional:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.1,<3" "scipy>=1.14,<2" "datasets>=3,<5" "hf_xet>=1.1"
      - name: Run
        working-directory: arc_whest
        run: |
          mkdir -p ../artifacts
          set -o pipefail
          python directional_multilayer.py \
            --start 16 --rows 2 --order 12 \
            --depths "1,2,4,8,16" --scales "0.5,0.75,1,1.25,1.5,2" \
            --output ../artifacts/directional.json \
            2>&1 | tee ../artifacts/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc-whest-public-directional-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          compression-level: 1
          retention-days: 30
