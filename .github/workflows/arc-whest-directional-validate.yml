name: ARC Whest public directional K3 validation

on:
  push:
    branches: [arc-whest-autoresearch-20260829]
    paths:
      - "arc_whest/directional_validate.py"
      - ".github/workflows/arc-whest-directional-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_XET_HIGH_PERFORMANCE: "1"
  HF_HOME: ${{ github.workspace }}/.hf-cache
  OMP_NUM_THREADS: "4"
  OPENBLAS_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  NUMEXPR_NUM_THREADS: "4"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.5,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install \
            "numpy>=2.1,<3" "scipy>=1.14,<2" "datasets>=3,<5" "hf_xet>=1.1" \
            "einops>=0.8" "jaxtyping>=0.2" "joblib>=1.4" "opt_einsum>=3.4" \
            "quimb>=1.11" "blobfile>=3" "tqdm>=4.66"
          python -m pip install --no-deps \
            "git+https://github.com/alignment-research-center/mlp_cumulant_propagation.git@93d091a4c26c042bfffa28f2e76a81bc0aba94bb"
      - name: Validate
        working-directory: arc_whest
        run: |
          mkdir -p ../artifacts
          set -o pipefail
          python directional_validate.py --start 16 --rows 2 --order 12 \
            --output ../artifacts/directional_validate.json \
            2>&1 | tee ../artifacts/validate.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc-whest-public-directional-validate-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          compression-level: 1
          retention-days: 30
