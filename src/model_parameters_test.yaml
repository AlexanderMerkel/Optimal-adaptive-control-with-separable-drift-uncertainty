# Problem Configuration
T: 1.0                    # Time horizon (1 year)
DT: 0.01                  # Time step (100 steps total)
SIGMA: 0.2                # Price volatility

# Temporary impact strength
RHO: 0.1                  # Temporary price impact coefficient

# Transient impact strength (regime parameters)
LAMBDA_L: 0.5             # Low impact regime (liquid market)
LAMBDA_H: 2.0             # High impact regime (illiquid market)

# Resilience of transient impact
KAPPA_L: 10.0             # High resilience (liquid)
KAPPA_H: 2.0              # Low resilience (illiquid)

# Inventory Cost
C_RUNNING: 0.01           # Running inventory cost
C_TERMINAL: 10.0          # Terminal inventory penalty

# Initial conditions
Y_0: 100.0                # Initial asset price
X_0: 10.0                 # Initial inventory (shares to liquidate)
P_0: 0.5                  # Initial belief (50% probability each regime)

# REINFORCE Training Configuration (TEST VALUES)
REINFORCE:
  n_episodes: 10          # Training episodes (SMALL FOR TESTING)
  hidden_dim: 32          # Neural network hidden units (SMALL)
  learning_rate: 0.001    # Adam optimizer learning rate
  batch_size: 8           # Batch size for policy updates (SMALL)
  log_interval: 5         # Progress reporting frequency (FREQUENT)
  eval_interval: 10       # Evaluation frequency (NEVER TRIGGERED)
  eval_episodes: 5        # Episodes for evaluation (SMALL)

# Comparison Configuration (TEST VALUES)
COMPARISON:
  n_evaluation_episodes: 5   # Episodes for final performance evaluation (SMALL)

STATE_BOUNDS:
  t: [0.0, 1.0]
  S: [-5.0, 20.0]
  X: [-5.0, 20.0]
  p: [0.0, 1.0]
  alpha_l: [0.0, 5.0]
  alpha_h: [0.0, 5.0]

INITIAL_STATE:
  t: 0.0
  S: 100.0
  X: 10.0
  p: 0.5
  alpha_l: 0.0
  alpha_h: 0.0